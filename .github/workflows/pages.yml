name: Documentation Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: python -m pip install --no-cache-dir markdown

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static documentation site into runner temp
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_HTML_URL: ${{ github.event.repository.html_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -B - <<'PY'
          import html
          import os
          import posixpath
          import re
          import shutil
          import urllib.parse
          from pathlib import Path, PurePosixPath
          import markdown

          SITE_TITLE = "IronFrame OuterFortress (Cart) 01 Decomp"
          DEFAULT_REPO = "StreamResearch/IronFrame-OuterFortress-Cart-01-Decomp"
          DEFAULT_PAGES = "https://streamresearch.github.io/IronFrame-OuterFortress-Cart-01-Decomp/"
          EXCLUDED_PARTS = {"plans", "reports", "tests", "archive", "corpus", ".git"}

          repo_html_url = (os.environ.get("REPO_HTML_URL") or "").strip().rstrip("/")
          gh_repo = (os.environ.get("GITHUB_REPOSITORY") or "").strip() or DEFAULT_REPO
          if not repo_html_url:
              repo_html_url = f"https://github.com/{gh_repo}"

          base_url = (os.environ.get("PAGES_BASE_URL") or "").strip()
          if not base_url:
              if "/" in gh_repo and os.environ.get("GITHUB_REPOSITORY"):
                  owner, repo_name = gh_repo.split("/", 1)
                  base_url = f"https://{owner.lower()}.github.io/{repo_name}/"
              else:
                  base_url = DEFAULT_PAGES
          if not base_url.endswith("/"):
              base_url += "/"

          parsed_base = urllib.parse.urlparse(base_url)
          base_path = parsed_base.path or "/"
          if not base_path.endswith("/"):
              base_path += "/"

          site_dir = Path(os.environ["RUNNER_TEMP"]) / "site"
          if site_dir.exists():
              shutil.rmtree(site_dir)
          site_dir.mkdir(parents=True, exist_ok=True)

          # Copy clean-room repo emblems into $site/Dev/assets/
          assets_src = Path("Dev/assets")
          assets_dst = site_dir / "Dev" / "assets"
          assets_dst.mkdir(parents=True, exist_ok=True)
          for ext in ("svg", "png", "ico"):
              src_asset = assets_src / f"IronFrame-OuterFortress-Cart-01-Decomp.{ext}"
              if src_asset.is_file():
                  shutil.copy2(src_asset, assets_dst / src_asset.name)

          # Collect strictly public Markdown sources
          overview_srcs = [
              Path("README.md"),
              Path("FEATURES.md"),
              Path("ROADMAP.md"),
              Path("CHANGELOG.md"),
              Path("CONTRIBUTING.md"),
              Path("SECURITY.md"),
          ]
          manual_order = [
              Path("Dev/docs/ARCHITECTURE.md"),
              Path("Dev/docs/SPECIFICATIONS.md"),
              Path("Dev/docs/FINDINGS.md"),
              Path("Dev/docs/OPERATIONS.md"),
          ]
          extra_manuals = [
              p for p in sorted(Path("Dev/docs").glob("*.md"))
              if p not in manual_order and p.name.upper() != "AGENTS.MD"
          ]
          manual_srcs = [p for p in (*manual_order, *extra_manuals) if p.is_file()]
          spoke_srcs = []
          for spoke_dir in ("specifications", "findings", "stages"):
              sd = Path("Dev/docs") / spoke_dir
              if sd.is_dir():
                  spoke_srcs.extend(sorted(sd.glob("*.md")))

          def is_public_doc(p: Path) -> bool:
              if not p.is_file() or p.name.upper() == "AGENTS.MD":
                  return False
              return not any(part.lower() in EXCLUDED_PARTS for part in p.parts)

          overview_srcs = [p for p in overview_srcs if is_public_doc(p)]
          manual_srcs = [p for p in manual_srcs if is_public_doc(p)]
          spoke_srcs = [p for p in spoke_srcs if is_public_doc(p)]
          all_docs = [*overview_srcs, *manual_srcs, *spoke_srcs]

          def out_rel(src: Path) -> Path:
              return Path("index.html") if src.as_posix() == "README.md" else src.with_suffix(".html")

          published_map = {p.as_posix(): out_rel(p).as_posix() for p in all_docs}

          NAV_LABELS = {
              "README.md": "Home",
              "FEATURES.md": "Features",
              "ROADMAP.md": "Roadmap",
              "CHANGELOG.md": "Changelog",
              "CONTRIBUTING.md": "Contributing",
              "SECURITY.md": "Security",
              "Dev/docs/ARCHITECTURE.md": "Architecture",
              "Dev/docs/SPECIFICATIONS.md": "Specifications",
              "Dev/docs/FINDINGS.md": "Findings",
              "Dev/docs/OPERATIONS.md": "Operations",
          }

          def doc_title_and_desc(src: Path, raw_text: str) -> tuple[str, str]:
              h1 = ""
              desc_lines: list[str] = []
              in_code = False
              for ln in raw_text.splitlines():
                  s = ln.strip()
                  if s.startswith("```"):
                      in_code = not in_code
                      continue
                  if in_code:
                      continue
                  if not h1 and s.startswith("# "):
                      h1 = re.sub(r"[`*_]", "", s[2:]).strip()
                      continue
                  if not s or s.startswith(("#", "|", "![", "---", "<div", "</div", "<details", "</details", "<summary")):
                      if desc_lines:
                          break
                      continue
                  clean = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", s)
                  clean = re.sub(r"[`*_>#]", "", clean).strip()
                  if clean:
                      desc_lines.append(clean)
                      if len(" ".join(desc_lines)) >= 155:
                          break
              title = NAV_LABELS.get(src.as_posix()) or h1 or src.stem.replace("-", " ").title()
              desc = " ".join(desc_lines)[:160].strip() or (
                  "Clean-room 6502 decompilation research, binary format specifications, "
                  "and portable .decomp tooling for NES-ME-USA (UNROM Mapper 2)."
              )
              return title, desc

          def count_toc_items(tokens: list[dict]) -> int:
              total = 0
              for tok in tokens:
                  total += 1 + count_toc_items(tok.get("children") or [])
              return total

          def preprocess_markdown(raw_md: str) -> str:
              cleaned = re.sub(
                  r'<div\s+align=["\']center["\']\s*>([\s\S]*?)</div>',
                  lambda m: "\n" + m.group(1).strip() + "\n",
                  raw_md,
              )
              return cleaned.replace("<details>", '<details markdown="1">')

          def rewrite_html_links(body_html: str, src: Path) -> str:
              src_dir = src.parent.as_posix()
              def _repl(match: re.Match[str]) -> str:
                  quote = match.group(1)
                  href = match.group(2).strip()
                  if not href or href.startswith(("#", "http://", "https://", "mailto:", "tel:", "javascript:")):
                      return match.group(0)
                  path_part, sep, frag = href.partition("#")
                  frag_str = f"#{frag}" if sep else ""
                  if not path_part:
                      return match.group(0)
                  joined = path_part if src_dir in ("", ".") else f"{src_dir}/{path_part}"
                  norm = posixpath.normpath(joined)
                  if path_part.lower().endswith(".md"):
                      if norm in published_map:
                          target_html = published_map[norm]
                          cur_out_dir = out_rel(src).parent.as_posix()
                          rel_href = posixpath.relpath(target_html, start="." if cur_out_dir in ("", ".") else cur_out_dir)
                          return f'href={quote}{rel_href}{frag_str}{quote}'
                      if PurePosixPath(path_part).name.lower() == "readme.md":
                          prefix_part = path_part[:-len("README.md")]
                          return f'href={quote}{prefix_part}index.html{frag_str}{quote}'
                      return f'href={quote}{path_part[:-3]}.html{frag_str}{quote}'
                  if path_part.lower().endswith((".html", ".svg", ".png", ".ico")):
                      return match.group(0)
                  clean_norm = norm[2:] if norm.startswith("./") else norm
                  return f'href={quote}{repo_html_url}/blob/main/{clean_norm}{frag_str}{quote}'
              return re.sub(r'href=(["\'])([^"\']+)\1', _repl, body_html)

          def style_task_items_and_tables(body_html: str) -> str:
              body_html = re.sub(
                  r"<li>(\s*<p>)?\[x\]\s+",
                  lambda m: f'<li class="task-item">{m.group(1) or ""}<input type="checkbox" checked disabled aria-label="Completed"> ',
                  body_html,
                  flags=re.IGNORECASE,
              )
              body_html = re.sub(
                  r"<li>(\s*<p>)?\[ \]\s+",
                  lambda m: f'<li class="task-item">{m.group(1) or ""}<input type="checkbox" disabled aria-label="Pending"> ',
                  body_html,
              )
              body_html = body_html.replace("<table>", '<div class="table-wrap"><table>').replace("</table>", "</table></div>")
              return body_html

          CSS = """
          :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --bg-subtle: #f8fafc;
            --surface: #f4f4f5;
            --border: #e4e4e7;
            --text: #18181b;
            --muted: #52525b;
            --accent: #b45309;
            --accent-soft: #fef3c7;
            --code-bg: #f4f4f5;
            --shadow: 0 1px 2px rgba(9, 9, 11, 0.06);
          }
          @media (prefers-color-scheme: dark) {
            :root {
              --bg: #09090b;
              --bg-subtle: #111115;
              --surface: #18181b;
              --border: #27272a;
              --text: #f4f4f5;
              --muted: #a1a1aa;
              --accent: #fbbf24;
              --accent-soft: rgba(245, 158, 11, 0.14);
              --code-bg: #18181b;
              --shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
            }
          }
          *, *::before, *::after { box-sizing: border-box; }
          html { scroll-behavior: smooth; }
          body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
          }
          a { color: var(--accent); text-decoration: none; }
          a:hover { text-decoration: underline; }
          a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
          .skip-link {
            position: absolute; left: -9999px; top: 0.5rem; z-index: 100;
            background: var(--accent); color: #09090b; padding: 0.5rem 0.9rem;
            border-radius: 6px; font-weight: 700;
          }
          .skip-link:focus { left: 0.75rem; }
          .topbar {
            position: sticky; top: 0; z-index: 40;
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
          }
          .topbar-inner {
            max-width: 1380px; margin: 0 auto; padding: 0.65rem 1.25rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
          }
          .brand {
            display: inline-flex; align-items: center; gap: 0.65rem;
            color: var(--text); font-weight: 700; font-size: 0.98rem; letter-spacing: -0.01em;
          }
          .brand:hover { text-decoration: none; }
          .brand img { display: block; border-radius: 6px; }
          .topnav { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; font-size: 0.88rem; }
          .topnav a {
            color: var(--muted); padding: 0.3rem 0.58rem; border-radius: 6px; font-weight: 500;
          }
          .topnav a:hover { color: var(--text); background: var(--surface); text-decoration: none; }
          .topnav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
          .layout {
            max-width: 1380px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem;
            display: grid; grid-template-columns: 260px minmax(0, 1fr) 220px; gap: 2rem; align-items: start;
          }
          .sidebar {
            position: sticky; top: 4.5rem; max-height: calc(100vh - 5.5rem); overflow-y: auto;
            padding-right: 0.5rem;
          }
          .sidebar-group { margin-bottom: 1.25rem; }
          .sidebar-heading {
            font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted); margin: 0 0 0.4rem 0.6rem;
          }
          .sidebar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; }
          .sidebar-list a {
            display: block; padding: 0.35rem 0.65rem; border-radius: 6px;
            color: var(--muted); font-size: 0.9rem; line-height: 1.35;
          }
          .sidebar-list a:hover { color: var(--text); background: var(--surface); text-decoration: none; }
          .sidebar-list a.active {
            color: var(--accent); background: var(--accent-soft); font-weight: 600;
            border-left: 3px solid var(--accent); padding-left: calc(0.65rem - 3px);
          }
          .mobile-nav { display: none; margin-bottom: 1.25rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-subtle); padding: 0.5rem 0.85rem; }
          .mobile-nav summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
          main { min-width: 0; }
          article { max-width: 820px; }
          article h1 { font-size: 1.95rem; line-height: 1.22; margin-top: 0; margin-bottom: 0.9rem; letter-spacing: -0.02em; }
          article h2 { font-size: 1.38rem; margin-top: 2rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); }
          article h3 { font-size: 1.12rem; margin-top: 1.45rem; }
          article img { max-width: 100%; height: auto; }
          article hr { border: 0; border-top: 1px solid var(--border); margin: 1.75rem 0; }
          blockquote {
            margin: 1rem 0; padding: 0.6rem 1rem; border-left: 4px solid var(--accent);
            background: var(--bg-subtle); border-radius: 0 6px 6px 0; color: var(--text);
          }
          blockquote p { margin: 0.25rem 0; }
          pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
          code { background: var(--code-bg); padding: 0.14em 0.36em; border-radius: 4px; border: 1px solid var(--border); }
          pre {
            background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px;
            padding: 0.95rem 1.05rem; overflow-x: auto; box-shadow: var(--shadow);
          }
          pre code { background: transparent; border: 0; padding: 0; font-size: 0.86rem; }
          .table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border); border-radius: 8px; }
          table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
          th, td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
          th { background: var(--surface); font-weight: 600; }
          tr:last-child td { border-bottom: 0; }
          details { border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.9rem; background: var(--bg-subtle); margin: 1rem 0; }
          summary { cursor: pointer; font-weight: 600; }
          .task-item { list-style: none; margin-left: -1.25rem; }
          .task-item input { margin-right: 0.45rem; accent-color: var(--accent); }
          .toc-aside { position: sticky; top: 4.5rem; font-size: 0.84rem; border-left: 1px solid var(--border); padding-left: 1rem; }
          .toc-title { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.5rem; }
          .toc-aside ul, .toc-inline ul { list-style: none; margin: 0; padding-left: 0; }
          .toc-aside ul ul, .toc-inline ul ul { padding-left: 0.85rem; }
          .toc-aside a, .toc-inline a { display: block; padding: 0.2rem 0; color: var(--muted); }
          .toc-aside a:hover, .toc-inline a:hover { color: var(--accent); text-decoration: none; }
          .toc-inline { display: none; }
          .mermaid { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
          .site-footer {
            border-top: 1px solid var(--border); background: var(--bg-subtle);
            padding: 1.5rem 1.25rem; font-size: 0.86rem; color: var(--muted);
          }
          .footer-inner {
            max-width: 1380px; margin: 0 auto; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 0.75rem 1.5rem;
          }
          .footer-links { display: flex; flex-wrap: wrap; gap: 0.9rem; }
          .not-found { max-width: 680px; margin: 3rem auto; padding: 2rem; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-subtle); text-align: center; }
          .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 1.25rem; }
          .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; }
          .btn-primary { background: var(--accent); border-color: var(--accent); color: #09090b; }
          @media (max-width: 1120px) {
            .layout { grid-template-columns: 240px minmax(0, 1fr); }
            .toc-aside { display: none; }
            .toc-inline { display: block; }
          }
          @media (max-width: 820px) {
            .layout { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
            .sidebar { display: none; }
            .mobile-nav { display: block; }
          }
          """.strip()

          TOP_NAV_ITEMS = [
              ("README.md", "Home"),
              ("FEATURES.md", "Features"),
              ("ROADMAP.md", "Roadmap"),
              ("CHANGELOG.md", "Changelog"),
              ("Dev/docs/ARCHITECTURE.md", "Architecture"),
              ("Dev/docs/SPECIFICATIONS.md", "Specs"),
              ("Dev/docs/FINDINGS.md", "Findings"),
              ("Dev/docs/OPERATIONS.md", "Operations"),
          ]

          def render_sidebar_groups(current_rel: str, root_prefix: str) -> str:
              groups = [
                  ("Overview", overview_srcs),
                  ("Technical Manuals", manual_srcs),
                  ("Research Spokes", spoke_srcs),
              ]
              parts: list[str] = []
              for heading, srcs in groups:
                  if not srcs:
                      continue
                  items: list[str] = []
                  for item in srcs:
                      item_posix = item.as_posix()
                      label = NAV_LABELS.get(item_posix) or item.stem.replace("-", " ").title()
                      href = f"{root_prefix}{published_map[item_posix]}"
                      is_cur = item_posix == current_rel
                      cls = ' class="active" aria-current="page"' if is_cur else ""
                      items.append(f'<li><a href="{html.escape(href)}"{cls}>{html.escape(label)}</a></li>')
                  parts.append(
                      f'<section class="sidebar-group"><h2 class="sidebar-heading">{html.escape(heading)}</h2>'
                      f'<ul class="sidebar-list">{"".join(items)}</ul></section>'
                  )
              return "".join(parts)

          def render_top_nav(current_rel: str, root_prefix: str) -> str:
              links: list[str] = []
              for src_key, label in TOP_NAV_ITEMS:
                  if src_key not in published_map:
                      continue
                  href = f"{root_prefix}{published_map[src_key]}"
                  is_cur = src_key == current_rel
                  cls = ' class="active" aria-current="page"' if is_cur else ""
                  links.append(f'<a href="{html.escape(href)}"{cls}>{html.escape(label)}</a>')
              links.append(f'<a href="{html.escape(repo_html_url)}/releases" target="_blank" rel="noopener">Releases</a>')
              links.append(f'<a href="{html.escape(repo_html_url)}" target="_blank" rel="noopener">GitHub</a>')
              return "".join(links)

          def render_shell(
              *,
              page_title: str,
              meta_desc: str,
              canonical_url: str,
              root_prefix: str,
              current_rel: str,
              main_html: str,
              toc_html: str = "",
              has_mermaid: bool = False,
              extra_meta: str = "",
          ) -> str:
              icon_svg = f"{root_prefix}Dev/assets/IronFrame-OuterFortress-Cart-01-Decomp.svg"
              icon_ico = f"{root_prefix}Dev/assets/IronFrame-OuterFortress-Cart-01-Decomp.ico"
              full_title = f"{page_title} — {SITE_TITLE}" if page_title != SITE_TITLE else SITE_TITLE
              top_nav = render_top_nav(current_rel, root_prefix)
              sidebar_html = render_sidebar_groups(current_rel, root_prefix)
              toc_inline = f'<details class="toc-inline"><summary>On This Page</summary>{toc_html}</details>' if toc_html else ""
              toc_aside = f'<aside class="toc-aside" aria-label="On this page"><p class="toc-title">On This Page</p>{toc_html}</aside>' if toc_html else ""
              mermaid_script = (
                  "<script type=\"module\">\n"
                  "import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';\n"
                  "const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;\n"
                  "mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });\n"
                  "const nodes = [];\n"
                  "document.querySelectorAll('pre > code.language-mermaid, code.mermaid').forEach((codeEl) => {\n"
                  "  const pre = codeEl.closest('pre');\n"
                  "  const div = document.createElement('div');\n"
                  "  div.className = 'mermaid';\n"
                  "  div.textContent = codeEl.textContent || '';\n"
                  "  (pre || codeEl).replaceWith(div);\n"
                  "  nodes.push(div);\n"
                  "});\n"
                  "if (nodes.length) { await mermaid.run({ nodes }); }\n"
                  "</script>"
                  if has_mermaid
                  else ""
              )
              return (
                  "<!doctype html>\n"
                  "<html lang=\"en\">\n<head>\n"
                  "<meta charset=\"utf-8\">\n"
                  "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
                  f"<title>{html.escape(full_title)}</title>\n"
                  f"<meta name=\"description\" content=\"{html.escape(meta_desc)}\">\n"
                  f"<link rel=\"canonical\" href=\"{html.escape(canonical_url)}\">\n"
                  f"<link rel=\"icon\" type=\"image/svg+xml\" href=\"{html.escape(icon_svg)}\">\n"
                  f"<link rel=\"alternate icon\" href=\"{html.escape(icon_ico)}\">\n"
                  f"<meta property=\"og:title\" content=\"{html.escape(full_title)}\">\n"
                  f"<meta property=\"og:description\" content=\"{html.escape(meta_desc)}\">\n"
                  "<meta property=\"og:type\" content=\"website\">\n"
                  f"<meta property=\"og:url\" content=\"{html.escape(canonical_url)}\">\n"
                  f"{extra_meta}"
                  f"<style>{CSS}</style>\n"
                  "</head>\n<body>\n"
                  '<a class="skip-link" href="#main-content">Skip to content</a>\n'
                  "<header class=\"topbar\"><div class=\"topbar-inner\">\n"
                  f'<a class="brand" href="{html.escape(root_prefix + "index.html")}">'
                  f'<img src="{html.escape(icon_svg)}" alt="" width="28" height="28">'
                  f"<span>{html.escape(SITE_TITLE)}</span></a>\n"
                  f'<nav class="topnav" aria-label="Primary navigation">{top_nav}</nav>\n'
                  "</div></header>\n"
                  "<div class=\"layout\">\n"
                  f'<aside class="sidebar" aria-label="Documentation sections">{sidebar_html}</aside>\n'
                  '<main id="main-content">\n'
                  f'<details class="mobile-nav"><summary>Documentation Menu</summary>{sidebar_html}</details>\n'
                  f"{toc_inline}"
                  f"{main_html}\n"
                  "</main>\n"
                  f"{toc_aside}\n"
                  "</div>\n"
                  "<footer class=\"site-footer\"><div class=\"footer-inner\">\n"
                  f"<span>Clean-room research documentation for <strong>NES-ME-USA</strong> (<code>UNROM / Mapper 2</code>).</span>\n"
                  '<nav class="footer-links" aria-label="Footer links">'
                  f'<a href="{html.escape(repo_html_url)}/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>'
                  f'<a href="{html.escape(root_prefix + "CONTRIBUTING.html")}">Contributing</a>'
                  f'<a href="{html.escape(root_prefix + "SECURITY.html")}">Security</a>'
                  f'<a href="{html.escape(repo_html_url)}/releases" target="_blank" rel="noopener">Releases</a>'
                  f'<a href="{html.escape(repo_html_url)}" target="_blank" rel="noopener">GitHub</a>'
                  "</nav></div></footer>\n"
                  f"{mermaid_script}\n"
                  "</body>\n</html>\n"
              )

          md_parser = markdown.Markdown(
              extensions=["tables", "fenced_code", "toc", "sane_lists", "md_in_html"],
              extension_configs={"toc": {"toc_depth": "2-4", "permalink": False}},
          )

          generated_urls: list[str] = []
          for src in all_docs:
              rel_out = out_rel(src)
              rel_out_posix = rel_out.as_posix()
              target = site_dir / rel_out
              target.parent.mkdir(parents=True, exist_ok=True)
              depth = len(rel_out.parts) - 1
              prefix = "../" * depth
              raw_text = src.read_text(encoding="utf-8")
              page_title, meta_desc = doc_title_and_desc(src, raw_text)
              md_parser.reset()
              body_html = md_parser.convert(preprocess_markdown(raw_text))
              body_html = style_task_items_and_tables(rewrite_html_links(body_html, src))
              heading_cnt = count_toc_items(getattr(md_parser, "toc_tokens", []))
              toc_html = md_parser.toc if (heading_cnt >= 2 and getattr(md_parser, "toc", "").strip()) else ""
              has_mermaid = ("language-mermaid" in body_html) or ('class="mermaid"' in body_html)
              canonical = f"{base_url}{rel_out_posix}"
              generated_urls.append(canonical)
              page_html = render_shell(
                  page_title=page_title,
                  meta_desc=meta_desc,
                  canonical_url=canonical,
                  root_prefix=prefix,
                  current_rel=src.as_posix(),
                  main_html=f"<article>{body_html}</article>",
                  toc_html=toc_html,
                  has_mermaid=has_mermaid,
              )
              target.write_text(page_html, encoding="utf-8")

          # Emit themed 404.html using root-relative base_path so deep missing URLs still navigate home cleanly
          not_found_main = (
              '<section class="not-found">'
              "<h1>404 — Page Not Found</h1>"
              "<p>The requested documentation page does not exist or moved during clean-room restructuring.</p>"
              '<div class="btn-row">'
              f'<a class="btn btn-primary" href="{html.escape(base_path + "index.html")}">Documentation Home</a>'
              f'<a class="btn" href="{html.escape(base_path + "Dev/docs/ARCHITECTURE.html")}">Architecture Manual</a>'
              f'<a class="btn" href="{html.escape(base_path + "Dev/docs/SPECIFICATIONS.html")}">Specifications Manual</a>'
              "</div></section>"
          )
          (site_dir / "404.html").write_text(
              render_shell(
                  page_title="Page Not Found (404)",
                  meta_desc="Requested documentation page was not found.",
                  canonical_url=f"{base_url}404.html",
                  root_prefix=base_path,
                  current_rel="",
                  main_html=not_found_main,
                  extra_meta='<meta name="robots" content="noindex">\n',
              ),
              encoding="utf-8",
          )

          # Emit .nojekyll, robots.txt, and sitemap.xml
          (site_dir / ".nojekyll").write_text("", encoding="utf-8")
          (site_dir / "robots.txt").write_text(
              f"User-agent: *\nAllow: /\nSitemap: {base_url}sitemap.xml\n",
              encoding="utf-8",
          )
          url_entries = "\n".join(f"  <url><loc>{html.escape(u)}</loc></url>" for u in generated_urls)
          (site_dir / "sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f"{url_entries}\n"
              "</urlset>\n",
              encoding="utf-8",
          )
          print(f"Built {len(all_docs)} HTML pages + 404.html + .nojekyll + robots.txt + sitemap.xml into {site_dir}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
